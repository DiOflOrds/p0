# Board-Check (T-0015, Retro-CR 1/3 Sprint 1): board.py --check + BOARD.md-Aktualitätsprüfung je Push/PR.
#
# VORAUSSETZUNG (einmalig, Mensch): board.py liegt im privaten Repo DiOflOrds/platform.
# Fine-grained PAT mit "Contents: Read" NUR für DiOflOrds/platform erzeugen
# (github.com -> Settings -> Developer settings -> Fine-grained tokens) und in
# DiOflOrds/p0 -> Settings -> Secrets and variables -> Actions als Secret
# PLATFORM_READ_TOKEN hinterlegen. Ohne Secret schlägt der Lauf mit klarer Meldung fehl.
name: Board-Check
on:
  push:
  pull_request:
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - name: Secret PLATFORM_READ_TOKEN vorhanden?
        env:
          TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret PLATFORM_READ_TOKEN fehlt (Lese-PAT für DiOflOrds/platform). Anleitung im Workflow-Kopf."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DiOflOrds/platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: .platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ticket-Validierung (Schema, Referenzen)
        run: python .platform-tools/scripts/board.py . --check --no-git
      - name: BOARD.md aktuell?
        run: |
          python .platform-tools/scripts/board.py . --no-git
          git diff --exit-code BOARD.md || { echo "::error::BOARD.md ist nicht aktuell — board.py laufen lassen und mitcommitten."; exit 1; }
